# Air hot-reload config for portfolio-go
root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && go build -o ./tmp/main ./cmd/api"
  entrypoint = "./tmp/main"
  include_ext = ["go", "templ", "html", "css", "js"]
  exclude_dir = ["tmp", ".atl", ".git"]
  exclude_regex = ["_templ.go$"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true
  main_only = true
